spring.application.name=Employee Management

# Server
server.port=8080

# ─── H2 In-Memory Database ────────────────────────────────────
# "mem:employeedb" = the DB lives in RAM, named "employeedb"
# DB_CLOSE_DELAY=-1  = keep the DB alive as long as the JVM runs
#                      (without this, the DB closes after the first connection)
# DB_CLOSE_ON_EXIT=FALSE = don't wipe data when the JVM shuts down gracefully
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ─── H2 Web Console (dev only – disable in prod) for browsing DB in browser ─────────────
# Open at: http://localhost:8080/h2-console
# JDBC URL to type in the console: jdbc:h2:mem:employeedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ─────────────────────────────────────────
# Show every SQL statement in the console (disable in prod)
spring.jpa.show-sql=true

# format sql
spring.jpa.properties.hibernate.format_sql=true

# "create-drop" = create tables on startup, DROP them when the app stops.
# Perfect for H2 (data is disposable). For a real DB use "update" or a
# migration tool like Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.hibernate.ddl-auto=update


# Tell Hibernate which SQL dialect to generate (H2-specific syntax)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect



# ─── SpringDoc / Swagger ─────────────────────────────────────
# Where the Swagger UI lives (default is /swagger-ui.html, but be explicit)
springdoc.swagger-ui.path=/swagger-ui.html
# Where the raw OpenAPI JSON spec lives
springdoc.api-docs.path=/v3/api-docs
# Show the Swagger UI in the browser (true for dev, false for prod)
springdoc.swagger-ui.enabled=true

# JWT SECRET
# production, the secret comes from your deployment platform's secrets manager (AWS Secrets Manager, GCP Secret Manager, etc.) — never from a file.
app.jwt.secret=${JWT_SECRET:mySuperSecretKeyThatIsAtLeast256BitsLongForHmacSha256Algorithm!!}






